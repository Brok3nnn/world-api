name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json ("packageManager": "pnpm@11.28.6").
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint, types, dead code, structure, migration and OpenAPI checks, tests with coverage,
      # and the production build.
      - name: Run the full gate
        run: pnpm verify
